  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#07111f; --text:#f2f1ec; --muted:#9eabbc; --line:#26364d; --accent:#8fb7ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"DM Sans",Arial,sans-serif; }
    header { height:70px; padding:0 5vw; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    a { color:inherit; text-decoration:none; }
    .back { color:var(--muted); }
    .back:hover { color:var(--text); }
    .open { color:var(--accent); }
    .frame-wrap { width:min(1000px,94vw); margin:28px auto 50px; background:white; min-height:calc(100vh - 150px); }
    iframe { display:block; width:100%; height:calc(100vh - 120px); min-height:800px; border:0; background:white; }
    @media (max-width:650px) { iframe { min-height:720px; } }
  </style>
</head>
